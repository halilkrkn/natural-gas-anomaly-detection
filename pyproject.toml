[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "natural-gas-anomaly-detection"
version = "0.1.0"
description = "Research scaffold for anomaly detection in synthetic natural-gas transmission time series"
readme = "README.md"
requires-python = ">=3.10"
# Runtime dependency names are declared here; exact pins must come from the tested
# Colab environment manifest, not from guessed versions.
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "scikit-learn",
  "torch",
  "fluids>=1.3.1",
  "PyYAML",
  "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
